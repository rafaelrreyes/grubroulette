name: grub-roulette

services:
  # Hot-reloading dev environment: `docker compose up`
  app:
    build:
      context: .
      target: dev
    ports:
      - "${WEB_PORT:-3337}:3337"
      - "${PORT:-4337}:4337"
    env_file:
      - path: .env
        required: false
    environment:
      WEB_PORT: 3337
      PORT: 4337
      WEB_HOST: 0.0.0.0
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - web_node_modules:/app/apps/web/node_modules
      - api_node_modules:/app/apps/api/node_modules
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:4337/api/health"]
      interval: 10s
      timeout: 3s
      start_period: 120s

  # Production image, same as CI/release: `docker compose --profile prod up --build prod`
  prod:
    profiles: [prod]
    build:
      context: .
    ports:
      - "8080:8080"
    env_file:
      - path: .env
        required: false
    environment:
      NODE_ENV: production
      PORT: 8080

volumes:
  node_modules:
  web_node_modules:
  api_node_modules:
