name: Deploy

on:
  push:
    tags: ["v*.*.*"]

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  deploy:
    name: Publish image, release, notify host
    needs: build
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Verify tag matches package.json version
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi

      - name: Download build output
        uses: actions/download-artifact@v8
        with:
          name: build
          path: apps

      - name: Package release tarball
        run: |
          tar -czf "grub-roulette-${GITHUB_REF_NAME}.tar.gz" \
            package.json package-lock.json .npmrc .nvmrc \
            apps/api/package.json apps/api/dist \
            apps/web/package.json apps/web/dist

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: APP_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "Grub Roulette $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag \
            "grub-roulette-${GITHUB_REF_NAME}.tar.gz"

      - name: Trigger Cursor Apps deploy hook (optional)
        env:
          CURSOR_DEPLOY_WEBHOOK_URL: ${{ secrets.CURSOR_DEPLOY_WEBHOOK_URL }}
        if: env.CURSOR_DEPLOY_WEBHOOK_URL != ''
        run: |
          curl -fsS -X POST "$CURSOR_DEPLOY_WEBHOOK_URL" \
            -H "content-type: application/json" \
            -d "{\"version\":\"$GITHUB_REF_NAME\",\"commit\":\"$GITHUB_SHA\",\"repository\":\"$GITHUB_REPOSITORY\"}"
