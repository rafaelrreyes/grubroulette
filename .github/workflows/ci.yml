name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Install, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint and format check (Biome)
        run: npx biome ci --reporter=github .

      - name: Build (typecheck + bundle)
        run: npm run build
        env:
          APP_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Upload build output
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            apps/web/dist
            apps/api/dist
          retention-days: 7
